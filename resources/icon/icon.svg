<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2F45"/>
      <stop offset="1" stop-color="#0E1018"/>
    </linearGradient>
    <linearGradient id="pick" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FF9A5A"/>
      <stop offset="1" stop-color="#F0453A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="18" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- body, sized to the macOS icon grid -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>

  <!-- the six strings of a tab staff -->
  <g clip-path="url(#body)" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7" stroke-linecap="round">
    <line x1="180" y1="330" x2="844" y2="330"/>
    <line x1="180" y1="404" x2="844" y2="404"/>
    <line x1="180" y1="478" x2="844" y2="478"/>
    <line x1="180" y1="552" x2="844" y2="552"/>
    <line x1="180" y1="626" x2="844" y2="626"/>
    <line x1="180" y1="700" x2="844" y2="700"/>
  </g>

  <!-- a pick carrying a play mark -->
  <g filter="url(#shadow)">
    <path d="M512 802 C 465 802 276 562 270 404 C 266 300 350 246 512 246 C 674 246 758 300 754 404 C 748 562 559 802 512 802 Z" fill="url(#pick)"/>
  </g>
  <path d="M472 368 L 472 516 L 595 442 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="34" stroke-linejoin="round"/>
</svg>
