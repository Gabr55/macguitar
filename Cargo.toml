[package]
name = "macguitar"
version = "0.13.1"
edition = "2024"
# based on ruxguitar by Arnaud Gourlay, https://github.com/agourlay/ruxguitar
authors = [
    "Габриелян Александр",
    "Arnaud Gourlay <arnaud.gourlay@gmail.com>",
]
description = "A Guitar Pro tablature player"
repository = "https://github.com/Gabr55/macguitar"
license = "Apache-2.0"
readme = "README.md"
categories = ["multimedia"]
keywords = ["guitar", "tablature", "music"]
# the test fixtures and the demo gif are not needed to build
exclude = ["test-files/", "*.gif"]

[lints.clippy]
cast_lossless = "warn"
doc_link_with_quotes = "warn"
enum_glob_use = "warn"
explicit_into_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inconsistent_struct_constructor = "warn"
inefficient_to_string = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
needless_continue = "warn"
needless_raw_string_hashes = "warn"
ptr_as_ptr = "warn"
ref_option_ref = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"
unused_self = "warn"
used_underscore_binding = "warn"
match_wildcard_for_single_variants = "warn"
needless_pass_by_ref_mut = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
unreadable_literal = "warn"
unused_async = "warn"

[dependencies]
nom = "8.0.0"
encoding_rs = "0.8.35"
iced = { version = "0.14.0", features = [
    "advanced",
    "canvas",
    "tokio",
    "selector",
    "svg",
] }
tokio = { version = "1.53.1", features = ["fs", "sync"] }
rfd = "0.17.2"
log = "0.4.33"
env_logger = "0.11.11"
rustysynth = "1.3.6"
cpal = "0.18.1"
thiserror = "2.0.20"
clap = { version = "4.6.6", features = ["derive", "cargo"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
roxmltree = "0.21.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
png = "0.18.1"

[profile.release]
lto = "fat"
codegen-units = 1
